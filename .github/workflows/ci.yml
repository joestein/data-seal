name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-lint-

      - name: Install ruff
        run: pip install "ruff>=0.3.0,<1.0"

      - name: Ruff lint
        run: ruff check dataseal/ tests/

      - name: Ruff format check
        run: ruff format --check dataseal/ tests/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dataseal
          POSTGRES_PASSWORD: dataseal
          POSTGRES_DB: dataseal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Tests use SQLite in-memory, but these are set to avoid import errors
      DATABASE_URL: postgresql+asyncpg://dataseal:dataseal@localhost:5432/dataseal_test
      DATABASE_URL_SYNC: postgresql://dataseal:dataseal@localhost:5432/dataseal_test
      VALKEY_URL: redis://localhost:6379/0
      # Must be 32+ chars; rejecting known weak values is enforced in config.py
      SECRET_KEY: ci-test-secret-key-long-enough-for-validation-32chars
      APP_URL: http://localhost:8000
      ENCRYPTION_KEY: ""
      SMTP_HOST: localhost
      SMTP_PORT: 1025

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-test-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=dataseal \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-security-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-security-

      - name: Install security tools
        run: pip install pip-audit bandit

      - name: Dependency audit (pip-audit)
        # Allow non-zero exit so bandit also runs; fail the step after both
        run: pip-audit --no-deps -r <(pip freeze) || echo "AUDIT_FAILED=1" >> "$GITHUB_ENV"

      - name: SAST scan (bandit)
        run: |
          bandit -r dataseal/ -ll \
            --exclude dataseal/email_templates,dataseal/templates \
            -f json -o bandit-report.json || echo "BANDIT_FAILED=1" >> "$GITHUB_ENV"

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7

      - name: Fail if any security scan found issues
        run: |
          if [ -n "$AUDIT_FAILED" ] || [ -n "$BANDIT_FAILED" ]; then
            echo "One or more security scans reported findings. Review artifacts."
            exit 1
          fi
