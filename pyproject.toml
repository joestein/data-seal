[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataseal"
version = "0.1.0"
description = "Electronic signature and agreement management platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.27.0,<1.0",
    "pydantic[email]>=2.6.0,<3.0",
    "pydantic-settings>=2.1.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.25,<3.0",
    "asyncpg>=0.29.0,<1.0",
    "alembic>=1.13.0,<2.0",
    "celery[redis]>=5.3.0,<6.0",
    "redis>=5.0.0,<6.0",
    "python-jose[cryptography]>=3.3.0,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt>=4.0.0,<5.0",
    "python-multipart>=0.0.7,<1.0",
    "httpx>=0.27.0,<1.0",
    "jinja2>=3.1.3,<4.0",
    "structlog>=24.1.0,<25.0",
    "uuid7>=0.1.0,<1.0",
    "PyPDF2>=3.0.0,<4.0",
    "reportlab>=4.1.0,<5.0",
    "pdf2image>=1.17.0,<2.0",
    "Pillow>=10.2.0,<11.0",
    "aiofiles>=23.2.0,<24.0",
    "slowapi>=0.1.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-cov>=4.1.0,<6.0",
    "httpx>=0.27.0,<1.0",
    "aiosqlite>=0.20.0,<1.0",
    "ruff>=0.3.0,<1.0",
    "mypy>=1.8.0,<2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez (timezone-aware datetimes)
    "T20", # flake8-print
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "ERA", # eradicate (commented-out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",   # assert statements (used in tests)
    "S105",   # hardcoded-password-string (false positives in tests/config)
    "S106",   # hardcoded-password-func-arg (false positives in tests)
    "S311",   # pseudo-random (non-crypto random is acceptable in non-security contexts)
    "PLR0913", # too-many-arguments (FastAPI routes often have many parameters)
    "PLR2004", # magic-value-comparison (too noisy)
    "RET504", # unnecessary-assign-before-return
    "ERA001", # commented-out-code (too aggressive)
]
per-file-ignores = { "tests/**" = ["S", "PLR", "T20"], "alembic/**" = ["ERA001"] }

[tool.ruff.lint.isort]
known-first-party = ["dataseal"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["dataseal"]
omit = ["dataseal/email_templates/*", "dataseal/templates/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass",
]
show_missing = true
